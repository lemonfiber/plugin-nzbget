# NZBGet reads every setting from this one file and takes its own default only
# for a setting missing here, so this is NZBGet's own template with its comments
# left out and these settings changed:
#
# - ControlUsername and ControlPassword are the account lemonfiber minted for
#   this plugin, which the adapter signs in with, so NZBGet never answers its API
#   to the template's well-known account. The restricted and add-only accounts
#   stay empty, which NZBGet reads as no such account.
# - AuthorizedIP is empty, so no address is let in without signing in.
# - No news server is held: the template's placeholder server is left out.
# - DestDir and InterDir are under the data root, and the categories are the ones
#   the curators hand their downloads to, each completing into its own folder
#   below DestDir.
# - UpdateCheck is off, so NZBGet reaches nothing but the Usenet provider.

# Paths
MainDir=/config
DestDir=${MainDir}/downloads/complete
InterDir=${MainDir}/downloads/incomplete
NzbDir=${MainDir}/nzb
QueueDir=${MainDir}/queue
TempDir=${MainDir}/tmp
WebDir=${AppDir}/webui
ScriptDir=${MainDir}/scripts
LockFile=${MainDir}/nzbget.lock
LogFile=${MainDir}/nzbget.log
ConfigTemplate=${AppDir}/webui/nzbget.conf.template
RequiredDir=
CertStore=${AppDir}/cacert.pem

# Security
ControlIP=0.0.0.0
ControlPort=6789
ControlUsername={{secret:upstream-username}}
ControlPassword={{secret:upstream-password}}
RestrictedUsername=
RestrictedPassword=
AddUsername=
AddPassword=
FormAuth=no
SecureControl=no
SecurePort=6791
SecureCert=
SecureKey=
AuthorizedIP=
CertCheck=yes
UpdateCheck=none
DaemonUsername=root
UMask=1000

# Categories
Category1.Name=movies
Category1.DestDir=
Category2.Name=tv
Category2.DestDir=
Category3.Name=music
Category3.DestDir=
Category4.Name=books
Category4.DestDir=

# Incoming nzbs
AppendCategoryDir=yes
NzbDirInterval=5
NzbDirFileAge=60
NzbDirArchiveScan=yes
NzbDirArchiveAction=delete
DupeCheck=yes

# Download queue
FlushQueue=yes
ContinuePartial=yes
PropagationDelay=0
ArticleCache=0
DirectWrite=yes
WriteBuffer=0
FileNaming=auto
RenameAfterUnpack=yes
RenameIgnoreExt=.zip, .7z, .rar, .par2
ReorderFiles=yes
PostStrategy=balanced
DiskSpace=250
NzbCleanupDisk=yes
KeepHistory=30
FeedHistory=7
SkipWrite=no
RawArticle=no

# Connection
ArticleRetries=3
ArticleInterval=10
ArticleTimeout=60
ArticleReadChunkSize=4
UrlRetries=3
UrlInterval=10
UrlTimeout=60
RemoteTimeout=90
DownloadRate=0
UrlConnections=4
UrlForce=yes
MonthlyQuota=0
QuotaStartDay=1
DailyQuota=0

# Logging
SystemHealthCheck=yes
WriteLog=rotate
RotateLog=3
ErrorTarget=both
WarningTarget=both
InfoTarget=both
DetailTarget=log
DebugTarget=log
LogBuffer=1000
NzbLog=yes
CrashTrace=yes
CrashDump=no
TimeCorrection=0

# Display (terminal)
OutputMode=curses
CursesNzbName=yes
CursesGroup=no
CursesTime=no
UpdateInterval=200

# Check and repair
CrcCheck=yes
ParCheck=auto
ParRepair=yes
ParScan=extended
ParQuick=yes
ParBuffer=16
ParThreads=0
ParIgnoreExt=.sfv, .nzb, .nfo
ParRename=yes
RarRename=yes
DirectRename=no
HardLinking=no
HardLinkingIgnoreExt=.zip, .7z, .rar, *.7z.###, *.r##
HealthCheck=park
ParTimeLimit=0
ParPauseQueue=no

# Unpack
Unpack=yes
DirectUnpack=no
UseTempUnpackDir=yes
UnpackPauseQueue=no
UnpackCleanupDisk=yes
UnrarCmd=unrar
SevenZipCmd=7z
ExtCleanupDisk=.par2, .sfv
UnpackIgnoreExt=.cbr
UnpackPassFile=

# Extension scripts
Extensions=
ScriptOrder=
ScriptPauseQueue=no
ShellOverride=
EventInterval=0
